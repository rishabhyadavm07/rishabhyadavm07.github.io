<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <link rel="icon" type="image/x-icon" href="/assets/favicon_io/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon_io/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon_io/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon_io/apple-touch-icon.png">
  <link rel="manifest" href="/assets/favicon_io/site.webmanifest">
  <title>Content Archive | fanaticalnerd</title>
  <meta name="description" content="Blog archive and research notes from fanaticalnerd — covering cloud security, API integrity, and cybersecurity experiments.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700;800&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --crimson: #dc2626;
      --crimson-dim: rgba(220, 38, 38, 0.12);
      --crimson-glow: rgba(220, 38, 38, 0.45);
      --black: #020202;
      --void: #050505;
      --surface: #0a0a0a;
      --elevated: #111111;
      --border: #1a1a1a;
      --text: #dddddd;
      --text-dim: #888888;
      --text-faint: #3a3a3a;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'JetBrains Mono', monospace;
      background-color: var(--black);
      color: var(--text);
      overflow-x: hidden;
    }
    ::selection { background: var(--crimson); color: #fff; }
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-thumb { background: var(--crimson); }

    /* ─── Ambient layers ─── */
    #ambient { position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.35; }
    .scanline { position: fixed; top: 0; left: 0; width: 100%; height: 2px; background: var(--crimson); opacity: 0.07; z-index: 50; pointer-events: none; animation: scan 7s linear infinite; }
    @keyframes scan { 0% { top: -5%; } 100% { top: 105%; } }
    .noise { position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0.025; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); background-repeat: repeat; background-size: 256px; }
    .vignette { position: fixed; inset: 0; z-index: 2; pointer-events: none; background: radial-gradient(circle at center, transparent 0%, var(--black) 100%); }

    /* ─── Layout ─── */
    .page-wrap { position: relative; z-index: 10; max-width: 900px; margin: 0 auto; padding: 80px 24px 160px; }

    /* ─── Back link ─── */
    .back-link {
      display: inline-flex; align-items: center; gap: 10px;
      font-size: 10px; font-weight: 700; letter-spacing: 0.3em; text-transform: uppercase;
      color: var(--text-faint); text-decoration: none;
      border: 1px solid var(--border); padding: 10px 20px;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      margin-bottom: 60px; display: inline-flex;
    }
    .back-link:hover { color: var(--crimson); border-color: rgba(220,38,38,0.4); }
    .back-link::before { content: '←'; }

    /* ─── Page header ─── */
    .page-header { margin-bottom: 80px; }
    .page-header__label {
      font-size: 10px; letter-spacing: 0.5em; color: var(--crimson);
      text-transform: uppercase; font-weight: 800; margin-bottom: 16px;
      display: flex; align-items: center; gap: 12px;
      opacity: 0; transform: translateX(-20px);
      transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .page-header__label.visible { opacity: 1; transform: translateX(0); }
    .page-header__label::before { content: ''; display: block; width: 32px; height: 1px; background: var(--crimson); }
    .page-header__title {
      font-family: 'Inter', sans-serif; font-size: clamp(1.2rem, 3vw, 1.8rem);
      font-weight: 800; line-height: 1; letter-spacing: -0.03em; color: #fff;
      opacity: 0; transform: translateY(20px);
      transition: all 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.1s;
    }
    .page-header__title.visible { opacity: 1; transform: translateY(0); }
    .page-header__status {
      margin-top: 14px; font-size: 10px; letter-spacing: 0.3em; color: var(--text-faint);
      opacity: 0; transition: opacity 0.8s ease 0.3s;
    }
    .page-header__status.visible { opacity: 1; }
    .pulse-dot { display: inline-block; width: 7px; height: 7px; background: var(--crimson); border-radius: 50%; box-shadow: 0 0 10px var(--crimson); animation: pulse 2s ease-in-out infinite; margin-right: 8px; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(0.8)} }

    /* ─── Section label ─── */
    .section-label {
      font-size: 10px; letter-spacing: 0.4em; color: var(--crimson);
      text-transform: uppercase; font-weight: 700; margin-bottom: 32px;
      display: flex; align-items: center; gap: 12px;
      opacity: 0; transform: translateX(-20px);
      transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .section-label.visible { opacity: 1; transform: translateX(0); }
    .section-label::before { content: ''; display: block; width: 32px; height: 1px; background: var(--crimson); }

    /* ─── Content section ─── */
    .content-section { margin-bottom: 80px; }

    /* ─── Entry cards ─── */
    .entry-card {
      display: block; text-decoration: none; color: inherit;
      background: var(--elevated); border: 1px solid var(--border);
      border-left: 3px solid var(--crimson); padding: 28px 32px;
      margin-bottom: 12px; position: relative; overflow: hidden;
      opacity: 0; transform: translateX(-20px);
      transition: all 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .entry-card.visible { opacity: 1; transform: translateX(0); }
    .entry-card::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(90deg, var(--crimson-dim) 0%, transparent 60%);
      opacity: 0; transition: opacity 0.5s; pointer-events: none;
    }
    .entry-card:hover::before { opacity: 1; }
    .entry-card:hover { border-color: rgba(220,38,38,0.45); background: #141414; transform: translateX(6px); box-shadow: 0 10px 40px rgba(0,0,0,0.4); }
    .entry-card:hover .entry-arrow { color: var(--crimson); }

    .entry-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 10px; }
    .entry-title {
      font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 700;
      color: #fff; line-height: 1.35; letter-spacing: -0.01em;
      transition: color 0.3s;
    }
    .entry-card:hover .entry-title { color: var(--crimson); }
    .entry-date { font-size: 9px; color: var(--text-faint); letter-spacing: 0.2em; font-weight: 700; white-space: nowrap; flex-shrink: 0; padding-top: 2px; }
    .entry-excerpt { font-size: 12.5px; color: #999; line-height: 1.75; font-weight: 300; margin-bottom: 16px; }
    .entry-meta { display: flex; align-items: center; gap: 10px; font-size: 9px; color: var(--text-faint); font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; }
    .entry-arrow { transition: color 0.3s; }

    /* ─── Empty state ─── */
    .empty-state { font-size: 10px; color: var(--text-faint); letter-spacing: 0.3em; text-transform: uppercase; font-weight: 700; padding: 40px 0; }

    /* ─── Loading skeletons ─── */
    .skeleton {
      background: var(--elevated); border: 1px solid var(--border); border-left: 3px solid var(--text-faint);
      padding: 28px 32px; margin-bottom: 12px; animation: shimmer 1.5s ease-in-out infinite;
    }
    .skeleton-line { height: 12px; background: var(--border); border-radius: 2px; margin-bottom: 10px; }
    .skeleton-line.w60 { width: 60%; }
    .skeleton-line.w80 { width: 80%; }
    .skeleton-line.w40 { width: 40%; }
    @keyframes shimmer { 0%,100%{opacity:0.4} 50%{opacity:0.8} }

    /* ─── Floating Nav (matching index.html exactly) ─── */
    .floating-nav {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      z-index: 1000; display: flex; flex-direction: column; align-items: center; gap: 16px;
    }
    .nav-cards {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
      max-width: 90vw;
      opacity: 0; transform: translateY(30px) scale(0.9);
      pointer-events: none;
      transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .floating-nav:hover .nav-cards,
    .floating-nav.open .nav-cards { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
    .nav-card {
      width: 82px; height: 92px; background: rgba(12,12,12,0.95);
      backdrop-filter: blur(16px); border: 1px solid var(--border);
      border-radius: 14px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 8px;
      text-decoration: none; color: var(--text-dim);
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      opacity: 0; transform: translateY(20px) scale(0.7); position: relative; overflow: hidden;
    }
    .nav-card::before {
      content: ''; position: absolute; inset: 0; border-radius: 14px;
      background: radial-gradient(circle at 50% 0%, rgba(220,38,38,0.15), transparent 70%);
      opacity: 0; transition: opacity 0.4s;
    }
    .nav-card:hover::before { opacity: 1; }
    .floating-nav:hover .nav-card,
    .floating-nav.open .nav-card { opacity: 1; transform: translateY(0) scale(1); }
    .nav-card:nth-child(1){transition-delay:0.04s} .nav-card:nth-child(2){transition-delay:0.08s}
    .nav-card:nth-child(3){transition-delay:0.12s} .nav-card:nth-child(4){transition-delay:0.16s}
    .nav-card:nth-child(5){transition-delay:0.20s} .nav-card:nth-child(6){transition-delay:0.24s}
    .nav-card:nth-child(7){transition-delay:0.28s}
    .nav-card:hover {
      border-color: var(--crimson); color: #fff;
      transform: translateY(-10px) scale(1.12) !important;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 20px rgba(220,38,38,0.2);
    }
    .nav-card:hover .nc-icon { color: var(--crimson); }
    .nav-card:hover .nc-label { color: #fff; }
    .nc-icon { width: 20px; height: 20px; position: relative; z-index: 1; }
    .nc-label { font-size: 8px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; position: relative; z-index: 1; }
    .nav-trigger {
      padding: 14px 48px; background: var(--crimson); color: #fff;
      font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 800;
      letter-spacing: 0.5em; text-align: center; cursor: pointer; border: none;
      border-radius: 40px; position: relative; overflow: hidden;
      box-shadow: 0 8px 32px rgba(220,38,38,0.35), 0 0 0 1px rgba(220,38,38,0.5);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .nav-trigger:hover { background: #b91c1c; letter-spacing: 0.65em; box-shadow: 0 12px 40px rgba(220,38,38,0.5); transform: translateY(-2px); }
    .nav-trigger:active { transform: scale(0.95); }
    .nav-trigger::after {
      content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
      animation: triggerShine 3s ease-in-out infinite;
    }
    @keyframes triggerShine { 0%,100%{left:-100%} 50%{left:100%} }

    /* ─── Footer ─── */
    footer { position: relative; z-index: 10; text-align: center; padding: 60px 24px; border-top: 1px solid var(--border); }
    .footer-copy { font-size: 10px; color: var(--text-faint); opacity: 0.4; letter-spacing: 0.3em; }

    @media (max-width: 768px) {
      .page-wrap { padding: 60px 20px 140px; }
      .page-header__title { font-size: clamp(1rem, 6vw, 1.4rem); }
      .entry-card { padding: 20px; }
      .entry-top { flex-direction: column; gap: 6px; }
      .floating-nav { bottom: 16px; }
      .nav-card { width: 66px; height: 76px; }
      .nc-label { font-size: 7px; }
      .nav-trigger { padding: 12px 32px; font-size: 9px; letter-spacing: 0.35em; }
    }
    @media (max-width: 480px) {
      .page-wrap { padding: 48px 16px 120px; }
      .entry-card { padding: 16px; }
      .entry-title { font-size: 13px; }
      .nav-cards { gap: 6px; }
      .nav-card { width: 56px; height: 64px; }
      .nc-label { font-size: 6px; }
      .nav-trigger { padding: 10px 24px; letter-spacing: 0.25em; }
    }
  </style>
</head>
<body>
  <canvas id="ambient"></canvas>
  <div class="noise"></div>
  <div class="vignette"></div>
  <div class="scanline"></div>

  <div class="page-wrap">

    <a class="back-link" href="index.html">BACK TO INTERFACE</a>

    <div class="page-header">
      <div class="page-header__label" data-animate>Content Archive</div>
      <h1 class="page-header__title" data-animate-delay>CONTENT_ARCHIVE</h1>
      <div class="page-header__status" data-animate-delay2>
        <span class="pulse-dot"></span>DATABASE_SYNC: ACTIVE
      </div>
    </div>

    <div class="content-section" id="blogsSection">
      <div class="section-label" data-animate>Research &amp; Blogs</div>
      <div id="blogsGrid">
        <div class="skeleton"><div class="skeleton-line w80"></div><div class="skeleton-line w60"></div><div class="skeleton-line w40"></div></div>
        <div class="skeleton"><div class="skeleton-line w80"></div><div class="skeleton-line w60"></div><div class="skeleton-line w40"></div></div>
        <div class="skeleton"><div class="skeleton-line w80"></div><div class="skeleton-line w60"></div><div class="skeleton-line w40"></div></div>
      </div>
    </div>

    <div class="content-section" id="projectsSection">
      <div class="section-label" data-animate>Projects</div>
      <div id="projectsGrid">
        <div class="skeleton"><div class="skeleton-line w80"></div><div class="skeleton-line w60"></div><div class="skeleton-line w40"></div></div>
        <div class="skeleton"><div class="skeleton-line w80"></div><div class="skeleton-line w60"></div><div class="skeleton-line w40"></div></div>
      </div>
    </div>

  </div>

  <footer>
    <div class="footer-copy">© FANATICALNERD // h4ppy_h4cking | rishabhyadav.inbox@gmail.com</div>
  </footer>

  <div class="floating-nav" id="floatingNav">
    <div class="nav-cards" id="navCards"></div>
    <button class="nav-trigger" id="navTrigger">NAV</button>
  </div>

  <script>
  (function() {
    const NAV_LINKS = [
      {name:"HOME",url:"index.html",icon:"home"},
      {name:"JOB DASH",url:"jobs.html",icon:"activity"},
      {name:"INTEL",url:"intel.html",icon:"radar"},
      {name:"REPORTS",url:"Disclosed-Reports/reports_index.html",icon:"file-text"},
      {name:"PREPPP",url:"interview_ques.html",icon:"cloud"}
    ];
    const iconSvgs = {
      home:'<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>',
      activity:'<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"/></svg>',
      radar:'<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19.07 4.93A10 10 0 0 0 6.99 3.34"/><path d="M4 6h.01"/><path d="M2.29 9.62A10 10 0 1 0 21.31 8.35"/><circle cx="12" cy="12" r="2"/></svg>',
      'file-text':'<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8l6 6v12a2 2 0 0 1-2 2z"/><path d="M14 2v6h6"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>',
      cloud:'<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>',
      book:'<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>',
      lock:'<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>'
    };

    // Nav
    document.getElementById('navCards').innerHTML = NAV_LINKS.map(l =>
      `<a class="nav-card" href="${l.url}"><div class="nc-icon">${iconSvgs[l.icon]}</div><div class="nc-label">${l.name}</div></a>`
    ).join('');
    const floatingNav = document.getElementById('floatingNav');
    document.getElementById('navTrigger').addEventListener('click', e => { e.stopPropagation(); floatingNav.classList.toggle('open'); });
    document.addEventListener('click', () => floatingNav.classList.remove('open'));
    floatingNav.addEventListener('click', e => e.stopPropagation());

    // Ambient particles
    const canvas = document.getElementById('ambient');
    const ctx = canvas.getContext('2d');
    let particles = [];
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    resize(); window.addEventListener('resize', resize);
    class P {
      constructor() { this.x=Math.random()*canvas.width; this.y=Math.random()*canvas.height; this.size=Math.random()*1.2+0.4; this.sx=(Math.random()-0.5)*0.25; this.sy=(Math.random()-0.5)*0.25; this.o=Math.random()*0.4+0.1; }
      update() { this.x+=this.sx; this.y+=this.sy; if(this.x>canvas.width)this.x=0; if(this.x<0)this.x=canvas.width; if(this.y>canvas.height)this.y=0; if(this.y<0)this.y=canvas.height; }
      draw() { ctx.fillStyle=`rgba(220,38,38,${this.o})`; ctx.beginPath(); ctx.arc(this.x,this.y,this.size,0,Math.PI*2); ctx.fill(); }
    }
    for(let i=0;i<90;i++) particles.push(new P());
    (function loop() { ctx.clearRect(0,0,canvas.width,canvas.height); particles.forEach(p=>{p.update();p.draw();}); requestAnimationFrame(loop); })();

    // Intersection observer for animations
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => { if(entry.isIntersecting) entry.target.classList.add('visible'); });
    }, { threshold: 0.1 });
    document.querySelectorAll('[data-animate]').forEach(el => observer.observe(el));

    // Header animations on load
    setTimeout(() => document.querySelector('.page-header__label').classList.add('visible'), 200);
    setTimeout(() => document.querySelector('.page-header__title').classList.add('visible'), 350);
    setTimeout(() => document.querySelector('.page-header__status').classList.add('visible'), 500);

    // Inline fallback data (keeps local file:// opening working)
    const INLINE_DATA = {"blogs":[{"title":"How to Beat the Warden in Minecraft","folder":"how-to-roast-a-warden","date":"2025-04-1","author":"Rishabh","AI_generated":"Human Written, AI Edited","excerpt":"A completely serious and not-at-all chaotic guide to defeating the Warden using pure panic, questionable logic, and maybe some wool.","thumbnail":"/BLOGS/how-to-roast-a-warden/src/win.png"},{"title":"My Adventures in AI Red Teaming What I Learned This Week","folder":"My-Adventures-in-AI-Red-Teaming-What-I-Learned-This-Week","date":"2025-10-31","author":"Rishabh","AI_generated":"Human Written, AI Edited","excerpt":"AI Red Teaming: Uncovering AI's sneaky flaws, from prompt injection to hidden attacks. Learn how!","thumbnail":"/BLOGS/My-Adventures-in-AI-Red-Teaming-What-I-Learned-This-Week/src/Thumbnail2.png"},{"title":"I Tried to Teach an AI Agent Security… Now It Corrects My Grammar","folder":"i-tried-to-teach-an-ai-agent-security-now-it-corrects-my-grammar","date":"2025-10-25","author":"Rishabh","AI_generated":"Human Written, AI Edited","excerpt":"This is a living journal of my experiments with AI agents and security automation.","thumbnail":"/assets/1.png"}],"projects":[]};

    // Load blogs data
    async function loadData() {
      let data = INLINE_DATA;
      try {
        const res = await fetch('BLOGS/blogs.json');
        if (res.ok) data = await res.json();
      } catch(e) { /* use inline fallback */ }
      const blogs = (data.blogs || []).sort((a,b) => new Date(b.date) - new Date(a.date));
      const projects = (data.projects || []).sort((a,b) => new Date(b.date) - new Date(a.date));
      renderCards('blogsGrid', blogs, false);
      renderCards('projectsGrid', projects, true);
    }

    function renderCards(containerId, items, isProject) {
      const grid = document.getElementById(containerId);
      if (!items.length) { grid.innerHTML = '<div class="empty-state">NO ENTRIES DETECTED IN SECTOR</div>'; return; }
      grid.innerHTML = '';
      items.forEach((item, i) => {
        const url = isProject ? (item.url || `posts/${item.folder}.html`) : `posts/${item.folder}.html`;
        const card = document.createElement('a');
        card.className = 'entry-card';
        card.href = url;
        card.style.transitionDelay = `${i * 60}ms`;
        card.innerHTML = `
          <div class="entry-top">
            <div class="entry-title">${item.title}</div>
            <div class="entry-date">${item.date || ''}</div>
          </div>
          <div class="entry-excerpt">${item.excerpt || ''}</div>
          <div class="entry-meta"><span class="entry-arrow">>></span> READ_CONTENT_LOG</div>`;
        grid.appendChild(card);
        const cardObserver = new IntersectionObserver(entries => {
          entries.forEach(e => { if(e.isIntersecting) { e.target.classList.add('visible'); cardObserver.unobserve(e.target); } });
        }, { threshold: 0.1 });
        cardObserver.observe(card);
      });
    }

    loadData();
  })();
  </script>
</body>
</html>
