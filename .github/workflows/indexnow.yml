name: Submit to IndexNow

on:
  push:
    branches: [main]

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Every URL in sitemap.xml (regenerated by build.py) is submitted, so new pages are picked up automatically.
      - name: Submit sitemap URLs to IndexNow
        run: |
          urls=$(grep -o '<loc>[^<]*' sitemap.xml | sed 's/<loc>//' | jq -R . | jq -s .)
          jq -n --argjson urls "$urls" '{
            host: "fanaticalnerd.com",
            key: "351f8be4a8fdc5984c9e6388abeef9b4bb9b7929ad3bb118170ab5a624c0ec0c",
            keyLocation: "https://fanaticalnerd.com/351f8be4a8fdc5984c9e6388abeef9b4bb9b7929ad3bb118170ab5a624c0ec0c.txt",
            urlList: $urls
          }' > payload.json
          curl -sS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data @payload.json -w "\nHTTP %{http_code}\n"
